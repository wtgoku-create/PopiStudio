name: Build Platforms

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS'
        required: true
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ========== macOS 构建 ==========
  build-macos:
    if: ${{ github.event_name == 'push' || inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@10.12.1 --activate
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Raise macOS open files limit
        run: |
          ulimit -n 65536 || true
          echo "Open files limit: $(ulimit -n)"
      
      - run: npm install
      
      # 设置 OpenClaw runtime (如果需要)
      - name: Setup OpenClaw Runtime
        run: |
          if [ -d "vendor/openclaw-runtime/current" ]; then
            echo "✓ OpenClaw runtime found"
          else
            echo "⚠ OpenClaw runtime not found, build may fail"
          fi

      - name: Import macOS signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            echo "macOS signing certificate is not configured, skipping certificate import"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/build-certificate.p12"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          case "$CSC_LINK" in
            http://*|https://*)
              curl --fail --location --silent --show-error "$CSC_LINK" --output "$CERTIFICATE_PATH"
              ;;
            data:*)
              printf '%s' "${CSC_LINK#*,}" | base64 --decode > "$CERTIFICATE_PATH"
              ;;
            *)
              printf '%s' "$CSC_LINK" | base64 --decode > "$CERTIFICATE_PATH"
              ;;
          esac

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      
      - name: Build macOS
        run: |
          npm run clean:release
          npm run dist:mac:x64 -- --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          POPIARTCLI_GITHUB_TOKEN: ${{ secrets.POPIARTCLI_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build-x64
          path: release/*.dmg
          retention-days: 7

      - name: Build macOS arm64
        run: |
          npm run clean:release
          npm run dist:mac:arm64 -- --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          POPIARTCLI_GITHUB_TOKEN: ${{ secrets.POPIARTCLI_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build-arm64
          path: release/*.dmg
          retention-days: 7

      - name: Delete macOS signing keychain
        if: ${{ always() }}
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "$CSC_KEYCHAIN"
          fi

  # ========== Windows 构建 ==========
  build-windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@10.12.1 --activate
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      
      - run: npm install
      
      # Windows 需要 Python 运行时
      - name: Setup Python Runtime
        run: npm run setup:python-runtime
        env:
          POPIAI_PORTABLE_PYTHON_ARCHIVE: ${{ secrets.WINDOWS_PYTHON_ARCHIVE }}
      
      - name: Build Windows
        run: npm run dist:win -- --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          POPIARTCLI_GITHUB_TOKEN: ${{ secrets.POPIARTCLI_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Inspect Windows release output
        shell: pwsh
        run: |
          if (Test-Path release) {
            Write-Host 'Listing files under release/'
            Get-ChildItem release -Recurse | Select-Object FullName, Length
          } else {
            Write-Host 'release/ directory does not exist'
          }
      
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*.exe
          retention-days: 7

  # ========== 创建 Release ==========
  create-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/macos-build-x64/*.dmg
            artifacts/macos-build-arm64/*.dmg
            artifacts/windows-build/*.exe
          draft: true
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-macos-installers:
    needs: [build-macos, create-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
      TENCENT_COS_ENDPOINT: ${{ vars.TENCENT_COS_ENDPOINT }}
      TENCENT_COS_PUBLIC_BASE_URL: ${{ vars.TENCENT_COS_PUBLIC_BASE_URL }}
      TENCENT_COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install COSCMD
        run: |
          python3 -m pip install --user coscmd
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Tencent COS
        env:
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          for name in TENCENT_COS_SECRET_ID TENCENT_COS_SECRET_KEY TENCENT_COS_BUCKET TENCENT_COS_REGION TENCENT_COS_PUBLIC_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "$name is required"
              exit 1
            fi
          done
          COSCMD_CONFIG_ARGS=(
            -a "$TENCENT_COS_SECRET_ID"
            -s "$TENCENT_COS_SECRET_KEY"
            -b "$TENCENT_COS_BUCKET"
            -r "$TENCENT_COS_REGION"
            -m 30
          )
          if [ -n "$TENCENT_COS_ENDPOINT" ]; then
            COSCMD_CONFIG_ARGS+=(-e "$TENCENT_COS_ENDPOINT")
          fi
          coscmd config "${COSCMD_CONFIG_ARGS[@]}"

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build-x64
          path: artifacts/macos-build-x64

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build-arm64
          path: artifacts/macos-build-arm64

      - name: Upload macOS x64 installer to Tencent COS
        env:
          APP_UPDATE_API_TOKEN: ${{ secrets.APP_UPDATE_API_TOKEN }}
        run: |
          X64_DMG="$(find artifacts/macos-build-x64 -name '*.dmg' | head -n 1)"
          if [ -z "$X64_DMG" ]; then
            echo "macOS x64 DMG not found"
            exit 1
          fi
          COS_PREFIX="${TENCENT_COS_PREFIX:-popiai/releases}"
          COS_PREFIX="${COS_PREFIX#/}"
          COS_PREFIX="${COS_PREFIX%/}"
          COS_KEY="${COS_PREFIX}/${GITHUB_REF_NAME}/mac-x64/$(basename "$X64_DMG")"
          coscmd upload "$X64_DMG" "$COS_KEY"
          INSTALLER_URL="${TENCENT_COS_PUBLIC_BASE_URL%/}/${COS_KEY}"
          node scripts/publish-app-update.cjs upload-url \
            --url "$INSTALLER_URL" \
            --platform mac-x64 \
            --tag "${GITHUB_REF_NAME}" \
            --signed true

      - name: Upload macOS arm64 installer to Tencent COS
        env:
          APP_UPDATE_API_TOKEN: ${{ secrets.APP_UPDATE_API_TOKEN }}
        run: |
          ARM64_DMG="$(find artifacts/macos-build-arm64 -name '*.dmg' | head -n 1)"
          if [ -z "$ARM64_DMG" ]; then
            echo "macOS arm64 DMG not found"
            exit 1
          fi
          COS_PREFIX="${TENCENT_COS_PREFIX:-popiai/releases}"
          COS_PREFIX="${COS_PREFIX#/}"
          COS_PREFIX="${COS_PREFIX%/}"
          COS_KEY="${COS_PREFIX}/${GITHUB_REF_NAME}/mac-arm64/$(basename "$ARM64_DMG")"
          coscmd upload "$ARM64_DMG" "$COS_KEY"
          INSTALLER_URL="${TENCENT_COS_PUBLIC_BASE_URL%/}/${COS_KEY}"
          node scripts/publish-app-update.cjs upload-url \
            --url "$INSTALLER_URL" \
            --platform mac-arm64 \
            --tag "${GITHUB_REF_NAME}" \
            --signed true

  publish-macos-metadata:
    needs: publish-macos-installers
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Publish macOS update metadata
        env:
          APP_UPDATE_API_TOKEN: ${{ secrets.APP_UPDATE_API_TOKEN }}
        run: |
          node scripts/publish-app-update.cjs update \
            --tag "${GITHUB_REF_NAME}"

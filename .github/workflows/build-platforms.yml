name: Build Platforms

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS'
        required: true
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ========== macOS 构建 ==========
  build-macos:
    if: ${{ github.event_name == 'push' || inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@10.12.1 --activate
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      
      - run: npm install
      
      # 设置 OpenClaw runtime (如果需要)
      - name: Setup OpenClaw Runtime
        run: |
          if [ -d "vendor/openclaw-runtime/current" ]; then
            echo "✓ OpenClaw runtime found"
          else
            echo "⚠ OpenClaw runtime not found, build may fail"
          fi
      
      - name: Build macOS
        run: |
          npm run clean:release
          npm run dist:mac:x64 -- --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          POPIARTCLI_GITHUB_TOKEN: ${{ secrets.POPIARTCLI_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # 签名环境变量 (如果有证书)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build-x64
          path: release/*.dmg
          retention-days: 7

      - name: Build macOS arm64
        run: |
          npm run clean:release
          npm run dist:mac:arm64 -- --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          POPIARTCLI_GITHUB_TOKEN: ${{ secrets.POPIARTCLI_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build-arm64
          path: release/*.dmg
          retention-days: 7

  # ========== Windows 构建 ==========
  build-windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@10.12.1 --activate
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      
      - run: npm install
      
      # Windows 需要 Python 运行时
      - name: Setup Python Runtime
        run: npm run setup:python-runtime
        env:
          POPIAI_PORTABLE_PYTHON_ARCHIVE: ${{ secrets.WINDOWS_PYTHON_ARCHIVE }}
      
      - name: Build Windows
        run: npm run dist:win -- --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          POPIARTCLI_GITHUB_TOKEN: ${{ secrets.POPIARTCLI_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*.exe
          retention-days: 7

  # ========== 创建 Release ==========
  create-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/macos-build-x64/*.dmg
            artifacts/macos-build-arm64/*.dmg
            artifacts/windows-build/*.exe
          draft: true
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-macos-installers:
    needs: [build-macos, create-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build-x64
          path: artifacts/macos-build-x64

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build-arm64
          path: artifacts/macos-build-arm64

      - name: Upload macOS x64 installer to app update service
        env:
          APP_UPDATE_API_TOKEN: ${{ secrets.APP_UPDATE_API_TOKEN }}
        run: |
          X64_DMG="$(find artifacts/macos-build-x64 -name '*.dmg' | head -n 1)"
          if [ -z "$X64_DMG" ]; then
            echo "macOS x64 DMG not found"
            exit 1
          fi
          node scripts/publish-app-update.cjs upload \
            --file "$X64_DMG" \
            --platform mac-x64 \
            --tag "${GITHUB_REF_NAME}" \
            --signed true

      - name: Upload macOS arm64 installer to app update service
        env:
          APP_UPDATE_API_TOKEN: ${{ secrets.APP_UPDATE_API_TOKEN }}
        run: |
          ARM64_DMG="$(find artifacts/macos-build-arm64 -name '*.dmg' | head -n 1)"
          if [ -z "$ARM64_DMG" ]; then
            echo "macOS arm64 DMG not found"
            exit 1
          fi
          node scripts/publish-app-update.cjs upload \
            --file "$ARM64_DMG" \
            --platform mac-arm64 \
            --tag "${GITHUB_REF_NAME}" \
            --signed true

  publish-macos-metadata:
    needs: publish-macos-installers
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Publish macOS update metadata
        env:
          APP_UPDATE_API_TOKEN: ${{ secrets.APP_UPDATE_API_TOKEN }}
        run: |
          node scripts/publish-app-update.cjs update \
            --tag "${GITHUB_REF_NAME}"
